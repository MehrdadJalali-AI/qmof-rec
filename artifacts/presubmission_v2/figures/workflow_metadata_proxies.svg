   <g id="text_1">
    <text style="fill: #143f4c; font: 700 11px 'DejaVu Sans'; text-anchor: start" x="30.8148" y="62.134328" transform="rotate(-0 30.8148 62.134328)">1  Query + catalog</text>
   </g>
   <g id="text_2">
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(30.8148 94.730652)">Existing QMOF records</text>
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(30.8148 108.977832)">Observed density and band gap</text>
   </g>
   <g id="text_3">
    <text style="fill: #143f4c; font: 700 11px 'DejaVu Sans'; text-anchor: start" x="270.5408" y="62.134328" transform="rotate(-0 270.5408 62.134328)">2  Candidate generation</text>
   </g>
   <g id="text_4">
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(270.5408 94.730652)">Deterministic semantic proxy</text>
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(270.5408 108.977832)">Shared pool of 100</text>
   </g>
   <g id="text_5">
    <text style="fill: #143f4c; font: 700 11px 'DejaVu Sans'; text-anchor: start" x="510.2668" y="62.134328" transform="rotate(-0 510.2668 62.134328)">3  Utility + representation</text>
   </g>
   <g id="text_6">
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(510.2668 94.730652)">Masked active objectives</text>
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(510.2668 108.977832)">Physical + formula + proxy S/A</text>
   </g>
   <g id="text_7">
    <text style="fill: #143f4c; font: 700 11px 'DejaVu Sans'; text-anchor: start" x="510.2668" y="219.089552" transform="rotate(-0 510.2668 219.089552)">4  Ranking / reranking</text>
   </g>
   <g id="text_8">
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(510.2668 251.685876)">WeightedSum, TOPSIS, Pareto</text>
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(510.2668 265.933056)">MMR, LEA, DE, Random, semantic</text>
   </g>
   <g id="text_9">
    <text style="fill: #143f4c; font: 700 11px 'DejaVu Sans'; text-anchor: start" x="270.5408" y="219.089552" transform="rotate(-0 270.5408 219.089552)">5  Top-five screening</text>
   </g>
   <g id="text_10">
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(270.5408 251.685876)">Utility, hybrid diversity</text>
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(270.5408 265.933056)">Descriptor-level sanity checks</text>
   </g>
   <g id="text_11">
    <text style="fill: #143f4c; font: 700 11px 'DejaVu Sans'; text-anchor: start" x="30.8148" y="219.089552" transform="rotate(-0 30.8148 219.089552)">6  Auxiliary explanation</text>
   </g>
   <g id="text_12">
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(30.8148 251.685876)">Candidate-conditioned templates</text>
    <text style="font: 9.5px 'DejaVu Sans'" transform="translate(30.8148 265.933056)">Identifier and limitation checks</text>
   </g>
   <g id="text_13">
    <text style="fill: #143f4c; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="21.512" y="21.468657" transform="rotate(-0 21.512 21.468657)">EXECUTED OFFLINE BENCHMARK</text>
   </g>
   <g id="text_14">
    <text style="font: 700 11px 'DejaVu Sans'; text-anchor: start" x="34.3928" y="356.78209" transform="rotate(-0 34.3928 356.78209)">Evidence boundaries</text>
   </g>
   <g id="text_15">
    <text style="font: 10px 'DejaVu Sans'; text-anchor: start" x="34.3928" y="380.325373" transform="rotate(-0 34.3928 380.325373)">Void fraction excluded; physical gap is masked; proxy A retains its zero fallback.</text>
   </g>
   <g id="text_16">
    <text style="font: 10px 'DejaVu Sans'; text-anchor: start" x="34.3928" y="401.728358" transform="rotate(-0 34.3928 401.728358)">No trained GNN, independent LLM-quality benchmark, or application-performance validation.</text>
   </g>
   <g id="text_17">
    <text style="fill: #555555; font: 9.5px 'DejaVu Sans'; text-anchor: start" x="21.512" y="453.095522" transform="rotate(-0 21.512 453.095522)">PROSPECTIVE: learned GraphSAGE/GAT or CIF-derived representations; independent expert/physical validation.</text>
   </g>
  </g>
