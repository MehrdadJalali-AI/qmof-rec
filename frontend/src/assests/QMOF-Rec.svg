  <circle cx="186" cy="50"  r="1.5" fill="#1EAED4" opacity="0.45"/>
  <circle cx="196" cy="118" r="2"   fill="#00D4AA" opacity="0.45"/>
  <circle cx="17"  cy="88"  r="1.5" fill="#1EAED4" opacity="0.45"/>
  <circle cx="26"  cy="152" r="2"   fill="#00D4AA" opacity="0.4"/>
  <circle cx="152" cy="194" r="1.5" fill="#1EAED4" opacity="0.4"/>

