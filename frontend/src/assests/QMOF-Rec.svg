  <circle cx="43"  cy="141" r="6"  fill="#0A7E9E" stroke="#1EAED4" stroke-width="1.3"/>
  <circle cx="43"  cy="69"  r="6"  fill="#0A7E9E" stroke="#1EAED4" stroke-width="1.3"/>

